name: Resume macOS notarization

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original Build and Release run ID containing signed checkpoints
        required: true
        type: string
      release_tag:
        description: Original release tag, for example v0.6.3
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: notarization-resume-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify original release build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/check-notarization-resume.py "$SOURCE_RUN_ID" "$RELEASE_TAG"

  resume:
    name: Resume macOS ${{ matrix.arch }}
    needs: validate
    environment: macos-release
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore exact signed checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notarization-pending-macos-${{ matrix.arch }}
          path: notarization-pending/${{ matrix.arch }}
          run-id: ${{ needs.validate.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Resume original Apple submission
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/finalize-macos-notarization.sh "${{ matrix.target }}" "${{ matrix.arch }}"
      - name: Clean up temporary API key
        if: always()
        shell: bash
        run: |
          for directory in "$RUNNER_TEMP"/luna-macos-notary.*; do
            [[ -d "$directory" ]] || continue
            rm -rf "$directory"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Collect and publish resumed release
    needs: [validate, resume]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore Windows installers from original build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-windows-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ needs.validate.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore finalized macOS installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-macos-*
          path: release-assets
          merge-multiple: true
      - name: Upload verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
        run: |
          # A tag can move during a long Apple wait; check it again before publication.
          python3 scripts/check-notarization-resume.py "$SOURCE_RUN_ID" "$RELEASE_TAG"
          files=(release-assets/Luna-Mux_macos-x64.dmg release-assets/Luna-Mux_macos-arm64.dmg release-assets/Luna-Mux_windows-x64-setup.exe release-assets/Luna-Mux_windows-x64-with-webview2-setup.exe)
          for file in "${files[@]}"; do
            test -s "$file"
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end')" == draft ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes --title "Luna Mux $RELEASE_TAG"
          fi
