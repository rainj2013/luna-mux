name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    environment: macos-release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_INCREMENTAL: "0"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check signing configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          xcodebuild -version
          xcrun notarytool history --help | grep -q 'Individual API Keys'
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macos-release environment secret: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache agent-browser sidecar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/native/binaries
          key: agent-browser-${{ matrix.target }}-${{ hashFiles('scripts/sync-agent-browser-sidecar.mjs') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/native -> target
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build application
        run: npm run build -- --no-bundle --target "${{ matrix.target }}"

      - name: Sign, notarize, and collect DMG
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/release-macos.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          # Also runs if the signing process was cancelled before its EXIT trap.
          for directory in "$RUNNER_TEMP"/luna-macos-signing.*; do
            [[ -d "$directory" ]] || continue
            security delete-keychain "$directory/signing.keychain-db" 2>/dev/null || true
            rm -rf "$directory"
          done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Windows x64 installers
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache agent-browser sidecar
        uses: actions/cache@v6
        with:
          path: app/native/binaries
          key: agent-browser-x86_64-pc-windows-msvc-${{ hashFiles('scripts/sync-agent-browser-sidecar.mjs') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native -> target
          shared-key: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build application once
        run: npm run build:win:prepare

      - name: Build standard NSIS installer
        run: npm run bundle:win

      - name: Collect standard NSIS installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "app/native/target/release/bundle/nsis/*-setup.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected one NSIS installer, found $($files.Count)"
          }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $files[0].FullName "release-assets/Luna-Mux_windows-x64-setup.exe"

      - name: Build WebView2 NSIS installer
        run: npm run bundle:win:webview2

      - name: Collect WebView2 NSIS installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "app/native/target/release/bundle/nsis/*-setup.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected one NSIS installer, found $($files.Count)"
          }
          Copy-Item $files[0].FullName "release-assets/Luna-Mux_windows-x64-with-webview2-setup.exe"

      - name: Upload standard Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-standard
          path: release-assets/Luna-Mux_windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload WebView2 Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-with-webview2
          path: release-assets/Luna-Mux_windows-x64-with-webview2-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Luna Mux $GITHUB_REF_NAME"
          fi
