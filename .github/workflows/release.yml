name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      APPLE_SIGNING_IDENTITY: "-"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache agent-browser sidecar
        uses: actions/cache@v4
        with:
          path: app/native/binaries
          key: agent-browser-${{ matrix.target }}-${{ hashFiles('scripts/sync-agent-browser-sidecar.mjs') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native -> target
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build DMG
        run: npm run build:mac -- --target "${{ matrix.target }}"

      - name: Collect DMG
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/native/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected one DMG, found ${#files[@]}"
            exit 1
          fi
          mkdir -p release-assets
          cp "${files[0]}" "release-assets/Luna-Mux_macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Windows x64 installers
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache agent-browser sidecar
        uses: actions/cache@v4
        with:
          path: app/native/binaries
          key: agent-browser-x86_64-pc-windows-msvc-${{ hashFiles('scripts/sync-agent-browser-sidecar.mjs') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native -> target
          shared-key: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build application once
        run: npm run build:win:prepare

      - name: Build standard NSIS installer
        run: npm run bundle:win

      - name: Collect standard NSIS installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "app/native/target/release/bundle/nsis/*-setup.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected one NSIS installer, found $($files.Count)"
          }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $files[0].FullName "release-assets/Luna-Mux_windows-x64-setup.exe"

      - name: Build WebView2 NSIS installer
        run: npm run bundle:win:webview2

      - name: Collect WebView2 NSIS installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "app/native/target/release/bundle/nsis/*-setup.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected one NSIS installer, found $($files.Count)"
          }
          Copy-Item $files[0].FullName "release-assets/Luna-Mux_windows-x64-with-webview2-setup.exe"

      - name: Upload standard Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-standard
          path: release-assets/Luna-Mux_windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload WebView2 Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-with-webview2
          path: release-assets/Luna-Mux_windows-x64-with-webview2-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Luna Mux $GITHUB_REF_NAME"
          fi
