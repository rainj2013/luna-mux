[package]
name = "luna-mux-terminal-runtime-contract-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

[lib]
path = "lib.rs"
