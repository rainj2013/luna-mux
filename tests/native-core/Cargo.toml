[package]
name = "luna-mux-native-core-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
path = "lib.rs"
